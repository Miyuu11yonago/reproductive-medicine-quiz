<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生殖QB">
<title>生殖専門医 Question Bank</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.app{max-width:620px;margin:0 auto;min-height:100vh;background:#fff}.header{background:#1769aa;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}.header-title{font-size:19px;font-weight:700}.header-sub{margin-top:4px;font-size:12px;opacity:.9}.home{padding:22px 18px}.hero{background:#eef6fc;border-radius:14px;padding:20px;margin-bottom:22px}.hero h2{margin:0 0 8px;font-size:21px}.hero p{margin:0;color:#555;line-height:1.6;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat{background:#f5f5f5;padding:14px 5px;border-radius:10px;text-align:center}.stat-number{font-size:23px;font-weight:700;color:#1769aa}.stat-label{margin-top:4px;font-size:11px;color:#666}.menu-button{width:100%;border:0;border-radius:12px;padding:17px;margin-bottom:12px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#1769aa;color:#fff}.secondary{background:#eaf3fa;color:#1769aa}.danger{background:#fff0f0;color:#b71c1c}.quiz{padding-bottom:105px}.quiz-top{padding:16px 18px 8px}.progress-info{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:8px}.progress-bar{height:6px;background:#e0e0e0;border-radius:10px;overflow:hidden}.progress{height:100%;background:#1769aa;width:0;transition:width .3s}.question-card{padding:20px 18px}.category{display:inline-block;background:#eaf3fa;color:#1769aa;border-radius:20px;padding:5px 11px;font-size:12px;margin-bottom:14px}.question{font-size:18px;font-weight:700;line-height:1.65;margin-bottom:8px}.instruction{color:#d84315;font-weight:700;font-size:14px;margin-bottom:18px}.choice{display:flex;align-items:flex-start;gap:12px;border:2px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:11px;cursor:pointer;background:#fff}.choice.selected{border-color:#1769aa;background:#eef6fc}.choice.correct{border-color:#2e7d32;background:#edf7ee}.choice.wrong{border-color:#c62828;background:#fff0f0}.choice-letter{min-width:27px;height:27px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:700}.choice-text{flex:1;line-height:1.55}.result-box{margin:5px 18px 20px;padding:17px;border-radius:12px}.result-correct{background:#edf7ee;border-left:5px solid #2e7d32}.result-wrong{background:#fff0f0;border-left:5px solid #c62828}.result-title{font-size:20px;font-weight:700;margin-bottom:8px}.explanation{margin:0 18px 20px;background:#fafafa;border-radius:12px;padding:18px}.explanation h3{margin-top:0;font-size:17px}.explanation-text{line-height:1.75;font-size:15px}.source{border-top:1px solid #ddd;margin-top:16px;padding-top:12px;font-size:13px;color:#555}.bottom-bar{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #ddd}.answer-button{width:100%;padding:16px;border:0;border-radius:12px;background:#1769aa;color:#fff;font-size:16px;font-weight:700}.answer-button:disabled{background:#bbb}.hidden{display:none}.back{margin:15px 18px 0;color:#1769aa;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-title">生殖専門医 Question Bank</div><div class="header-sub">生殖医療の必修知識2023</div></header>
<section id="home" class="home">
<div class="hero"><h2>生殖専門医試験対策</h2><p>『生殖医療の必修知識2023』をもとにした5択問題集です。学習履歴はこのブラウザ内に保存されます。</p></div>
<div class="stats"><div class="stat"><div id="totalCount" class="stat-number">0</div><div class="stat-label">問題数</div></div><div class="stat"><div id="answeredCount" class="stat-number">0</div><div class="stat-label">回答済み</div></div><div class="stat"><div id="wrongCount" class="stat-number">0</div><div class="stat-label">要復習</div></div></div>
<button class="menu-button primary" onclick="startQuiz('normal')">問題を解く</button>
<button class="menu-button secondary" onclick="startQuiz('wrong')">間違えた問題を復習</button>
<button class="menu-button secondary" onclick="startQuiz('random')">ランダム出題</button>
<button class="menu-button danger" onclick="resetProgress()">学習履歴をリセット</button>
</section>
<section id="quiz" class="quiz hidden">
<div class="back" onclick="goHome()">← ホームへ戻る</div>
<div class="quiz-top"><div class="progress-info"><span id="questionNumber"></span><span id="modeName"></span></div><div class="progress-bar"><div id="progress" class="progress"></div></div></div>
<div class="question-card"><div id="category" class="category"></div><div id="questionText" class="question"></div><div id="instruction" class="instruction"></div><div id="choices"></div></div>
<div id="resultBox" class="result-box hidden"></div>
<div id="explanation" class="explanation hidden"><h3>解説</h3><div id="explanationText" class="explanation-text"></div><div id="source" class="source"></div></div>
<div class="bottom-bar"><button id="answerButton" class="answer-button" onclick="submitAnswer()">回答する</button></div>
</section>
</div>
<script>
const questions=[
{id:1,category:"男性不妊",question:"特発性乏精子症・精子無力症について正しいものを2つ選べ。",choices:["精子濃度16×10⁶/mL未満を乏精子症とする。","精子運動率30％未満を精子無力症とする。","原因検索を行っても原因が特定できないものを特発性とする。","特発性男性不妊は男性不妊症例の10％未満である。","精子無力症ではFSH高値が診断に必須である。"],correct:[0,2],explanation:"教材では、精子濃度16×10⁶/mL未満を乏精子症、精子運動率42％未満を精子無力症としています。原因検索を行っても原因が明らかにならないものが特発性として扱われます。",pages:"p248"},
{id:2,category:"男性不妊",question:"精索静脈瘤の重症度分類について正しいものを2つ選べ。",choices:["Grade 1は立位安静時の視診のみで診断できる。","Grade 1は立位Valsalva負荷で触診可能である。","Grade 2は立位安静時に触診可能である。","Grade 3はValsalva負荷を行わなければ触診できない。","Grade 3は超音波検査でのみ診断可能である。"],correct:[1,2],explanation:"Grade 1は立位Valsalva負荷で触診可能、Grade 2は立位で触診可能、Grade 3は視診でも確認できる分類です。",pages:"p252"},
{id:3,category:"男性不妊",question:"低ゴナドトロピン性性腺機能低下症（MHH）の治療について正しいものを2つ選べ。",choices:["ゴナドトロピン補充療法ではhCGによってLH作用を補う。","rFSH製剤はLH作用を補う目的で使用する。","hCG単独で精子形成が得られない場合、rFSH製剤を追加する。","テストステロン療法は精子形成誘導を主目的とする。","GnRH療法では持続投与のみが有効である。"],correct:[0,2],explanation:"MHHではhCGによってLH作用を補充します。hCG単独で精子形成が得られない場合にはrFSH製剤を追加します。",pages:"p267–268"},
{id:4,category:"生殖補助医療",question:"ICSIについて正しいものを2つ選べ。",choices:["精子を卵細胞質内へ直接注入する。","精子注入時には精子を不動化する操作を行う。","精子自身が透明帯を通過する必要がある。","複数の精子を1個の卵子に注入する。","卵子を保持せず自由に浮遊させて精子を注入する。"],correct:[0,1],explanation:"ICSIは1個の精子を卵細胞質内へ直接注入する方法です。教材では精子の不動化を行って注入する手技が示されています。",pages:"p337–339"},
{id:5,category:"凍結保存",question:"胚のガラス化凍結について正しいものを2つ選べ。",choices:["高濃度の凍結保護剤を用いる。","急速に冷却する。","氷晶形成を積極的に促進する。","緩慢凍結より必ず低濃度の凍結保護剤を用いる。","融解後の胚移植では常に自然周期を用いる。"],correct:[0,1],explanation:"ガラス化法では高濃度の凍結保護剤と急速冷却を利用し、氷晶形成を避けてガラス化状態とします。",pages:"p364–365"}
];
let quizQuestions=[],currentIndex=0,selected=[],answered=false,currentMode="normal";
const read=(k)=>JSON.parse(localStorage.getItem(k)||"[]");
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function getWrongIds(){return read("wrongQuestions")}function getAnsweredIds(){return read("answeredQuestions")}
function saveWrong(id){const a=getWrongIds();if(!a.includes(id))a.push(id);write("wrongQuestions",a)}
function removeWrong(id){write("wrongQuestions",getWrongIds().filter(x=>x!==id))}
function saveAnswered(id){const a=getAnsweredIds();if(!a.includes(id))a.push(id);write("answeredQuestions",a)}
function updateStats(){document.getElementById("totalCount").textContent=questions.length;document.getElementById("answeredCount").textContent=getAnsweredIds().length;document.getElementById("wrongCount").textContent=getWrongIds().length}
function startQuiz(mode){currentMode=mode;if(mode==="wrong"){const ids=getWrongIds();quizQuestions=questions.filter(q=>ids.includes(q.id));if(!quizQuestions.length){alert("現在、復習する問題はありません。");return}}else if(mode==="random"){quizQuestions=[...questions].sort(()=>Math.random()-.5)}else quizQuestions=[...questions];currentIndex=0;document.getElementById("home").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion()}
function showQuestion(){answered=false;selected=[];const q=quizQuestions[currentIndex];document.getElementById("questionNumber").textContent=`${currentIndex+1} / ${quizQuestions.length}`;document.getElementById("modeName").textContent={normal:"通常",wrong:"復習",random:"ランダム"}[currentMode];document.getElementById("progress").style.width=`${((currentIndex+1)/quizQuestions.length)*100}%`;document.getElementById("category").textContent=q.category;document.getElementById("questionText").textContent=q.question;document.getElementById("instruction").textContent=`正しいものを${q.correct.length}つ選択してください`;const c=document.getElementById("choices");c.innerHTML="";q.choices.forEach((t,i)=>{const d=document.createElement("div");d.className="choice";d.onclick=()=>selectChoice(i);d.innerHTML=`<div class="choice-letter">${String.fromCharCode(65+i)}</div><div class="choice-text">${t}</div>`;c.appendChild(d)});document.getElementById("resultBox").classList.add("hidden");document.getElementById("explanation").classList.add("hidden");const b=document.getElementById("answerButton");b.textContent="回答する";b.disabled=true;b.onclick=submitAnswer}
function selectChoice(i){if(answered)return;const q=quizQuestions[currentIndex];if(selected.includes(i))selected=selected.filter(x=>x!==i);else{if(selected.length>=q.correct.length)return;selected.push(i)}document.querySelectorAll(".choice").forEach((e,n)=>e.classList.toggle("selected",selected.includes(n)));document.getElementById("answerButton").disabled=selected.length!==q.correct.length}
function submitAnswer(){const q=quizQuestions[currentIndex];answered=true;const ok=JSON.stringify([...selected].sort())===JSON.stringify([...q.correct].sort());saveAnswered(q.id);ok?removeWrong(q.id):saveWrong(q.id);document.querySelectorAll(".choice").forEach((e,i)=>{e.classList.remove("selected");if(q.correct.includes(i))e.classList.add("correct");else if(selected.includes(i))e.classList.add("wrong")});const r=document.getElementById("resultBox");r.classList.remove("hidden","result-correct","result-wrong");if(ok){r.classList.add("result-correct");r.innerHTML='<div class="result-title">○ 正解</div>'}else{r.classList.add("result-wrong");r.innerHTML=`<div class="result-title">× 不正解</div>正解：${q.correct.map(i=>String.fromCharCode(65+i)).join("・")}`};document.getElementById("explanation").classList.remove("hidden");document.getElementById("explanationText").textContent=q.explanation;document.getElementById("source").innerHTML=`<strong>出典</strong><br>生殖医療の必修知識2023　${q.pages}`;const b=document.getElementById("answerButton");if(currentIndex<quizQuestions.length-1){b.textContent="次の問題へ";b.onclick=nextQuestion}else{b.textContent="ホームへ";b.onclick=goHome}b.disabled=false;updateStats()}
function nextQuestion(){currentIndex++;window.scrollTo({top:0,behavior:"smooth"});showQuestion()}
function goHome(){document.getElementById("quiz").classList.add("hidden");document.getElementById("home").classList.remove("hidden");updateStats();window.scrollTo(0,0)}
function resetProgress(){if(confirm("回答履歴と間違えた問題をすべて削除しますか？")){localStorage.removeItem("wrongQuestions");localStorage.removeItem("answeredQuestions");updateStats()}}
updateStats();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生殖QB">
<title>生殖専門医 Question Bank</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:620px;margin:0 auto;min-height:100vh;background:#fff}
.header{background:#1769aa;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}
.header-title{font-size:20px;font-weight:800} .header-sub{margin-top:4px;font-size:12px;opacity:.9}
.home{padding:20px 18px 32px} .hero{background:#eef6fc;border-radius:16px;padding:18px;margin-bottom:18px}
.hero h2{margin:0 0 8px;font-size:21px} .hero p{margin:0;color:#555;line-height:1.6;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:#f5f5f5;padding:12px 4px;border-radius:12px;text-align:center}
.stat-number{font-size:22px;font-weight:800;color:#1769aa} .stat-label{margin-top:4px;font-size:10px;color:#666}
.section-title{font-size:15px;font-weight:800;margin:22px 2px 10px}
.menu-button{width:100%;border:0;border-radius:13px;padding:16px;margin-bottom:10px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#1769aa;color:#fff} .secondary{background:#eaf3fa;color:#1769aa} .soft{background:#f5f5f5;color:#333}
.danger{background:#fff0f0;color:#b71c1c}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.category-btn{border:1px solid #d7e5f1;background:#fff;border-radius:12px;padding:14px 8px;color:#1769aa;font-weight:700;font-size:14px}
.quiz{padding-bottom:112px} .back{margin:15px 18px 0;color:#1769aa;font-size:14px;cursor:pointer}
.quiz-top{padding:14px 18px 8px} .progress-info{display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:8px}
.progress-bar{height:6px;background:#e0e0e0;border-radius:10px;overflow:hidden} .progress{height:100%;background:#1769aa;width:0}
.question-card{padding:18px} .question-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.category{display:inline-block;background:#eaf3fa;color:#1769aa;border-radius:20px;padding:5px 11px;font-size:12px}
.star{border:0;background:#f5f5f5;border-radius:50%;width:42px;height:42px;font-size:23px;line-height:42px;padding:0}
.star.on{background:#fff5d6}
.history{font-size:12px;color:#666;margin:-2px 0 12px}
.question{font-size:18px;font-weight:800;line-height:1.65;margin-bottom:8px}
.instruction{color:#d84315;font-weight:800;font-size:14px;margin-bottom:18px}
.choice{display:flex;align-items:flex-start;gap:12px;border:2px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:11px;background:#fff}
.choice.selected{border-color:#1769aa;background:#eef6fc} .choice.correct{border-color:#2e7d32;background:#edf7ee} .choice.wrong{border-color:#c62828;background:#fff0f0}
.choice-letter{min-width:28px;height:28px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800}
.choice-text{flex:1;line-height:1.55}
.result-box{margin:5px 18px 18px;padding:17px;border-radius:12px} .result-correct{background:#edf7ee;border-left:5px solid #2e7d32} .result-wrong{background:#fff0f0;border-left:5px solid #c62828}
.result-title{font-size:20px;font-weight:800}
.explanation{margin:0 18px 20px;background:#fafafa;border-radius:12px;padding:18px} .explanation h3{margin-top:0}
.explanation-text{line-height:1.75;font-size:15px} .source{border-top:1px solid #ddd;margin-top:16px;padding-top:12px;font-size:13px;color:#555}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #ddd}
.answer-button{width:100%;padding:16px;border:0;border-radius:12px;background:#1769aa;color:#fff;font-size:16px;font-weight:800} .answer-button:disabled{background:#bbb}
.hidden{display:none} .empty{padding:40px 20px;text-align:center;color:#666;line-height:1.7}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-title">生殖専門医 Question Bank</div><div class="header-sub">生殖医療の必修知識2023</div></header>

<section id="home" class="home">
<div class="hero"><h2>生殖専門医試験対策</h2><p>5択問題を分野別・未回答・要復習・お気に入りから学習できます。履歴はこの端末内に保存されます。</p></div>
<div class="stats">
<div class="stat"><div id="totalCount" class="stat-number">0</div><div class="stat-label">全問題</div></div>
<div class="stat"><div id="unansweredCount" class="stat-number">0</div><div class="stat-label">未回答</div></div>
<div class="stat"><div id="wrongCount" class="stat-number">0</div><div class="stat-label">要復習</div></div>
<div class="stat"><div id="favoriteCount" class="stat-number">0</div><div class="stat-label">お気に入り</div></div>
</div>

<button class="menu-button primary" onclick="startQuiz('all')">全問題を解く</button>
<button class="menu-button secondary" onclick="startQuiz('unanswered')">未回答のみ</button>
<button class="menu-button secondary" onclick="startQuiz('wrong')">間違えた問題を復習</button>
<button class="menu-button secondary" onclick="startQuiz('favorite')">★ お気に入り</button>
<button class="menu-button soft" onclick="startQuiz('random')">ランダム出題</button>

<div class="section-title">分野別に解く</div>
<div id="categoryButtons" class="category-grid"></div>

<div class="section-title">学習データ</div>
<div id="scoreSummary" class="hero"></div>
<button class="menu-button danger" onclick="resetProgress()">学習履歴をリセット</button>
</section>

<section id="quiz" class="quiz hidden">
<div class="back" onclick="goHome()">← ホームへ戻る</div>
<div class="quiz-top">
<div class="progress-info"><span id="questionNumber"></span><span id="modeName"></span></div>
<div class="progress-bar"><div id="progress" class="progress"></div></div>
</div>
<div class="question-card">
<div class="question-meta"><div id="category" class="category"></div><button id="favoriteButton" class="star" onclick="toggleFavorite()">☆</button></div>
<div id="history" class="history"></div>
<div id="questionText" class="question"></div>
<div id="instruction" class="instruction"></div>
<div id="choices"></div>
</div>
<div id="resultBox" class="result-box hidden"></div>
<div id="explanation" class="explanation hidden"><h3>解説</h3><div id="explanationText" class="explanation-text"></div><div id="source" class="source"></div></div>
<div class="bottom-bar"><button id="answerButton" class="answer-button" onclick="submitAnswer()">回答する</button></div>
</section>
</div>

<script>
const questions=[
{id:1,category:"男性不妊",question:"特発性乏精子症・精子無力症について正しいものを2つ選べ。",choices:["精子濃度16×10⁶/mL未満を乏精子症とする。","精子運動率30％未満を精子無力症とする。","原因検索を行っても原因が特定できないものを特発性とする。","特発性男性不妊は男性不妊症例の10％未満である。","精子無力症ではFSH高値が診断に必須である。"],correct:[0,2],explanation:"教材では、精子濃度16×10⁶/mL未満を乏精子症、精子運動率42％未満を精子無力症としています。原因検索を行っても原因が明らかにならないものが特発性として扱われます。",pages:"p248"},
{id:2,category:"男性不妊",question:"精索静脈瘤の重症度分類について正しいものを2つ選べ。",choices:["Grade 1は立位安静時の視診のみで診断できる。","Grade 1は立位Valsalva負荷で触診可能である。","Grade 2は立位安静時に触診可能である。","Grade 3はValsalva負荷を行わなければ触診できない。","Grade 3は超音波検査でのみ診断可能である。"],correct:[1,2],explanation:"Grade 1は立位Valsalva負荷で触診可能、Grade 2は立位で触診可能、Grade 3は視診でも確認できる分類です。",pages:"p252"},
{id:3,category:"男性不妊",question:"低ゴナドトロピン性性腺機能低下症（MHH）の治療について正しいものを2つ選べ。",choices:["ゴナドトロピン補充療法ではhCGによってLH作用を補う。","rFSH製剤はLH作用を補う目的で使用する。","hCG単独で精子形成が得られない場合、rFSH製剤を追加する。","テストステロン療法は精子形成誘導を主目的とする。","GnRH療法では持続投与のみが有効である。"],correct:[0,2],explanation:"MHHではhCGによってLH作用を補充します。hCG単独で精子形成が得られない場合にはrFSH製剤を追加します。",pages:"p267–268"},
{id:4,category:"生殖補助医療",question:"ICSIについて正しいものを2つ選べ。",choices:["精子を卵細胞質内へ直接注入する。","精子注入時には精子を不動化する操作を行う。","精子自身が透明帯を通過する必要がある。","複数の精子を1個の卵子に注入する。","卵子を保持せず自由に浮遊させて精子を注入する。"],correct:[0,1],explanation:"ICSIは1個の精子を卵細胞質内へ直接注入する方法です。教材では精子の不動化を行って注入する手技が示されています。",pages:"p337–339"},
{id:5,category:"凍結保存",question:"胚のガラス化凍結について正しいものを2つ選べ。",choices:["高濃度の凍結保護剤を用いる。","急速に冷却する。","氷晶形成を積極的に促進する。","緩慢凍結より必ず低濃度の凍結保護剤を用いる。","融解後の胚移植では常に自然周期を用いる。"],correct:[0,1],explanation:"ガラス化法では高濃度の凍結保護剤と急速冷却を利用し、氷晶形成を避けてガラス化状態とします。",pages:"p364–365"}
];

let quizQuestions=[],currentIndex=0,selected=[],answered=false,currentMode="all";

function loadJSON(key, fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch(e){return fallback}}
function saveJSON(key,v){localStorage.setItem(key,JSON.stringify(v))}
function getStats(){return loadJSON("qbStats",{})}
function getFavorites(){return loadJSON("qbFavorites",[])}
function setFavorites(v){saveJSON("qbFavorites",v)}
function statFor(id){const s=getStats();return s[id]||{attempts:0,correct:0,wrong:0}}
function recordAnswer(id,isCorrect){
 const s=getStats(), x=s[id]||{attempts:0,correct:0,wrong:0};
 x.attempts++; if(isCorrect)x.correct++; else x.wrong++; s[id]=x; saveJSON("qbStats",s);
}
function answeredIds(){const s=getStats();return Object.keys(s).filter(k=>s[k].attempts>0).map(Number)}
function wrongIds(){const s=getStats();return Object.keys(s).filter(k=>s[k].wrong>0 && s[k].correct===0).map(Number)}

function updateStats(){
 const s=getStats(), fav=getFavorites(), answered=answeredIds();
 document.getElementById("totalCount").textContent=questions.length;
 document.getElementById("unansweredCount").textContent=questions.length-answered.length;
 document.getElementById("wrongCount").textContent=wrongIds().length;
 document.getElementById("favoriteCount").textContent=fav.length;
 let attempts=0,correct=0; Object.values(s).forEach(x=>{attempts+=x.attempts;correct+=x.correct});
 const rate=attempts?Math.round(correct/attempts*100):0;
 document.getElementById("scoreSummary").innerHTML=`<b>累計正答率 ${rate}%</b><br><span style="font-size:13px;color:#666">回答 ${attempts}回 ／ 正解 ${correct}回</span>`;
}

function buildCategories(){
 const cats=[...new Set(questions.map(q=>q.category))];
 const box=document.getElementById("categoryButtons"); box.innerHTML="";
 cats.forEach(c=>{const b=document.createElement("button");b.className="category-btn";b.textContent=c;b.onclick=()=>startQuiz("category",c);box.appendChild(b)});
}

function startQuiz(mode,categoryName=""){
 currentMode=mode;
 const a=answeredIds(), w=wrongIds(), f=getFavorites();
 if(mode==="unanswered") quizQuestions=questions.filter(q=>!a.includes(q.id));
 else if(mode==="wrong") quizQuestions=questions.filter(q=>w.includes(q.id));
 else if(mode==="favorite") quizQuestions=questions.filter(q=>f.includes(q.id));
 else if(mode==="random") quizQuestions=[...questions].sort(()=>Math.random()-.5);
 else if(mode==="category") quizQuestions=questions.filter(q=>q.category===categoryName);
 else quizQuestions=[...questions];
 if(!quizQuestions.length){alert(mode==="unanswered"?"未回答の問題はありません。":"該当する問題はありません。");return}
 currentIndex=0; document.getElementById("home").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion(categoryName);
}

function modeLabel(q){
 if(currentMode==="unanswered")return"未回答";
 if(currentMode==="wrong")return"要復習";
 if(currentMode==="favorite")return"お気に入り";
 if(currentMode==="random")return"ランダム";
 if(currentMode==="category")return q.category;
 return"全問題";
}

function showQuestion(){
 answered=false;selected=[];const q=quizQuestions[currentIndex];
 document.getElementById("questionNumber").textContent=`${currentIndex+1} / ${quizQuestions.length}`;
 document.getElementById("modeName").textContent=modeLabel(q);
 document.getElementById("progress").style.width=`${(currentIndex+1)/quizQuestions.length*100}%`;
 document.getElementById("category").textContent=q.category;
 document.getElementById("questionText").textContent=q.question;
 document.getElementById("instruction").textContent=`正しいものを${q.correct.length}つ選択してください`;
 const st=statFor(q.id); document.getElementById("history").textContent=st.attempts?`この問題：${st.attempts}回回答 ／ 正解 ${st.correct}回 ／ 不正解 ${st.wrong}回`:"この問題：未回答";
 refreshFavorite();
 const box=document.getElementById("choices");box.innerHTML="";
 q.choices.forEach((t,i)=>{const d=document.createElement("div");d.className="choice";d.dataset.index=i;d.onclick=()=>selectChoice(i);d.innerHTML=`<div class="choice-letter">${String.fromCharCode(65+i)}</div><div class="choice-text">${t}</div>`;box.appendChild(d)});
 document.getElementById("resultBox").className="result-box hidden";document.getElementById("explanation").classList.add("hidden");
 const b=document.getElementById("answerButton");b.textContent="回答する";b.disabled=true;b.onclick=submitAnswer;
}

function selectChoice(i){
 if(answered)return;const q=quizQuestions[currentIndex];
 if(selected.includes(i))selected=selected.filter(x=>x!==i);else{if(selected.length>=q.correct.length)return;selected.push(i)}
 document.querySelectorAll(".choice").forEach((e,j)=>e.classList.toggle("selected",selected.includes(j)));
 document.getElementById("answerButton").disabled=selected.length!==q.correct.length;
}

function submitAnswer(){
 const q=quizQuestions[currentIndex];answered=true;
 const ok=JSON.stringify([...selected].sort())===JSON.stringify([...q.correct].sort());
 recordAnswer(q.id,ok);
 document.querySelectorAll(".choice").forEach((e,i)=>{e.classList.remove("selected");if(q.correct.includes(i))e.classList.add("correct");else if(selected.includes(i))e.classList.add("wrong")});
 const r=document.getElementById("resultBox");r.classList.remove("hidden","result-correct","result-wrong");r.classList.add(ok?"result-correct":"result-wrong");
 const letters=q.correct.map(i=>String.fromCharCode(65+i)).join("・");
 r.innerHTML=`<div class="result-title">${ok?"○ 正解":"× 不正解"}</div>${ok?"":`正解：${letters}`}`;
 document.getElementById("explanation").classList.remove("hidden");document.getElementById("explanationText").textContent=q.explanation;
 document.getElementById("source").innerHTML=`<strong>出典</strong><br>生殖医療の必修知識2023　${q.pages}`;
 const st=statFor(q.id);document.getElementById("history").textContent=`この問題：${st.attempts}回回答 ／ 正解 ${st.correct}回 ／ 不正解 ${st.wrong}回`;
 const b=document.getElementById("answerButton");b.disabled=false;
 if(currentIndex<quizQuestions.length-1){b.textContent="次の問題へ";b.onclick=nextQuestion}else{b.textContent="ホームへ";b.onclick=goHome}
 updateStats();
}

function toggleFavorite(){
 const q=quizQuestions[currentIndex];let f=getFavorites();
 f=f.includes(q.id)?f.filter(x=>x!==q.id):[...f,q.id];setFavorites(f);refreshFavorite();updateStats();
}
function refreshFavorite(){
 const q=quizQuestions[currentIndex],on=getFavorites().includes(q.id),b=document.getElementById("favoriteButton");
 b.textContent=on?"★":"☆";b.classList.toggle("on",on);
}
function nextQuestion(){currentIndex++;window.scrollTo({top:0,behavior:"smooth"});showQuestion()}
function goHome(){document.getElementById("quiz").classList.add("hidden");document.getElementById("home").classList.remove("hidden");updateStats();window.scrollTo(0,0)}
function resetProgress(){
 if(confirm("回答履歴・正答率・お気に入りをすべて削除しますか？")){localStorage.removeItem("qbStats");localStorage.removeItem("qbFavorites");updateStats()}
}
buildCategories();updateStats();
</script>
</body>
</html>
